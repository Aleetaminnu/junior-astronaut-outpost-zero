
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

        <meta name="viewport"
                  content="width=device-width, initial-scale=1.0,
                            maximum-scale=1.0, user-scalable=no">

                                <title>Outpost Zero</title>

                                    <link rel="stylesheet" href="css/style.css">

                                        <script src="https://cdn.jsdelivr.net/npm/[email protected]/dist/phaser.min.js"></script>
                                        </head>

                                        <body>

                                            <header>
                                                    <h1>OUTPOST ZERO</h1>
                                                            <p>Junior Astronaut Mission Trainer</p>
                                                                </header>

                                                                    <main>

                                                                            <div id="game-container"></div>

                                                                                    <section id="dashboard">

                                                                                                <h2>MISSION CONTROL</h2>

                                                                                                            <p>Mission Day:
                                                                                                                            <span id="day">1</span> / 7
                                                                                                                                        </p>

                                                                                                                                                    <p>Science Points:
                                                                                                                                                                    <span id="science">0</span>
                                                                                                                                                                                </p>

                                                                                                                                                                                            <h3>LIFE SUPPORT</h3>

                                                                                                                                                                                                        <div class="resource">
                                                                                                                                                                                                                        Oxygen <span id="oxygen">80</span>
                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                <div class="resource">
                                                                                                                                                                                                                                                                Water <span id="water">80</span>
                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                        <div class="resource">
                                                                                                                                                                                                                                                                                                        Food <span id="food">80</span>
                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                <div class="resource">
                                                                                                                                                                                                                                                                                                                                                Power <span id="power">80</span>
                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                        <div class="resource">
                                                                                                                                                                                                                                                                                                                                                                                        Radiation Shield <span id="shield">80</span>
                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                <div class="resource">
                                                                                                                                                                                                                                                                                                                                                                                                                                Crew Health <span id="health">100</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>MISSION MESSAGE</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p id="message">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Welcome, astronaut!
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="end-day">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            END DAY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <section id="mobile-controls">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="direction-pad">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="move" data-dir="up">▲</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="middle-row">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="move" data-dir="left">◀</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="move" data-dir="down">▼</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="move" data-dir="right">▶</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="interact">INTERACT</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Explore the lunar base and keep your crew alive!
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script src="js/main.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
